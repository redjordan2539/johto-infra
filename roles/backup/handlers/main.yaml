- name: Reload systemd Daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start restic timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - restic-backup.timer
    - restic-prune.timer
  become: true
